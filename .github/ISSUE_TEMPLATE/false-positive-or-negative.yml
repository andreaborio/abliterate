name: False positive or false negative
description: A rule flagged safe code, or missed a vulnerability it should have caught.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Use a minimal synthetic example. Do not paste credentials or code from a private repository.
  - type: dropdown
    id: kind
    attributes:
      label: What happened
      options:
        - False positive (flagged safe code)
        - False negative (missed a real issue)
        - Wrong location or wrong CWE
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command or Action input
      placeholder: "abliterate sinks --changed --base main"
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Minimal code that reproduces it
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: abliterate version
      placeholder: "0.2.3"
