<svg xmlns="http://www.w3.org/2000/svg" width="850" height="236" viewBox="0 0 850 236" role="img" aria-labelledby="title desc">
  <title id="title">Review receipt for the synthetic team directory case</title>
  <desc id="desc">Committed: salary exposed. Index: private email exposed. Working tree: name only. The public card should only return the name.</desc>
  <defs>
    <pattern id="perforation" width="12" height="6" patternUnits="userSpaceOnUse"><path d="M0 0h12L6 6z" fill="#eeede5"/></pattern>
  </defs>
  <rect width="850" height="236" rx="9" fill="#121515"/>
  <g font-family="ui-monospace,Menlo,Consolas,monospace">
    <rect x="15" y="15" width="247" height="206" rx="5" fill="#090b0b" stroke="#343938"/>
    <rect x="32" y="36" width="11" height="11" rx="2" fill="#ffb21e"/>
    <text x="53" y="47" fill="#ffb21e" font-size="16">REVIEW OUTPUT</text>
    <text x="31" y="93" fill="#eff1eb" font-size="24" font-weight="bold">team directory</text>
    <text x="31" y="126" fill="#abb3af" font-size="16">scope: main…HEAD</text>
    <path d="M31 151h209" stroke="#464b49"/>
    <text x="31" y="187" fill="#abb3af" font-size="15">synthetic fixture</text>
    <rect x="281" y="15" width="554" height="201" fill="#eeede5"/>
    <rect x="281" y="216" width="554" height="6" fill="url(#perforation)"/>
    <g fill="#202423">
      <text x="303" y="47" font-size="17" font-weight="bold">SNAPSHOT RECEIPT</text>
      <text x="812" y="47" text-anchor="end" font-size="15">members / directory</text>
      <path d="M303 62h508" stroke="#8a8e88" stroke-dasharray="4 4"/>
      <g font-size="19">
        <text x="303" y="94">HEAD</text><text x="500" y="94">salary exposed</text>
        <text x="303" y="128">INDEX</text><text x="500" y="128">private email exposed</text>
        <text x="303" y="162">WORKING TREE</text><text x="500" y="162">name only</text>
      </g>
      <path d="M303 177h508" stroke="#8a8e88" stroke-dasharray="4 4"/>
      <text x="303" y="201" font-size="15">Contract: public profile returns name only.</text>
    </g>
  </g>
</svg>
