[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[project]
name = "abliterate"
version = "0.2.4"
description = "The abliterate security review skills and prompts for coding agents (the analysis engine is on npm)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "andreaborio" }]
requires-python = ">=3.9"
keywords = ["security", "code-review", "sast", "sarif", "devsecops", "agent-skill", "claude-code", "codex", "ai-agents", "appsec"]

[project.scripts]
abliterate = "abliterate.cli:main"

[project.urls]
Homepage = "https://abliterate.io"
Repository = "https://github.com/andreaborio/abliterate"
Issues = "https://github.com/andreaborio/abliterate/issues"
