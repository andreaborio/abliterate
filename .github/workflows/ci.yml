name: Verify release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --prefix engine --ignore-scripts --no-audit --no-fund
      - run: npx --prefix engine tsc -p engine --noEmit
      # Tests replay recorded OSV/KEV/EPSS responses: no network calls to advisory services.
      - run: npm test --prefix engine
      # The plugin ships the built engine as bin/abliterate: it must match the source.
      - name: bin/abliterate is the build of engine/src
        run: git diff --exit-code -- bin/abliterate

  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.16'
          enable-cache: false
      - run: python3 build.py
      - run: python3 verification/check_release.py
      - run: python3 verification/make_cases.py "$RUNNER_TEMP/abliterate-cases"
      - run: python3 evals/make_fixtures.py "$RUNNER_TEMP/abliterate-fixtures"
      - name: Validate the Claude Code plugin and marketplace
        run: npx -y @anthropic-ai/claude-code@2.1.326 plugin validate . --strict

  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: action
          persist-credentials: false
      - name: Put a fixture repository in the workspace
        run: |
          set -eu
          python3 action/evals/make_fixtures.py "$RUNNER_TEMP/fx"
          cp -R "$RUNNER_TEMP/fx/sqli-express/." "$GITHUB_WORKSPACE/"
          echo "action/" >> "$GITHUB_WORKSPACE/.git/info/exclude"
          git -C "$GITHUB_WORKSPACE" checkout -q feature
          mkdir "$GITHUB_WORKSPACE/.abliterate"
          echo '{"version":1,"scope":{"states":[],"complete":true,"note":"from checkout"},"findings":[]}' > "$GITHUB_WORKSPACE/.abliterate/findings.json"
      - id: review
        uses: ./action
        with:
          base: main
          # On a push or a fork, exercise the configured-but-skipped agent path without a key.
          agent: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'none' || 'claude' }}
          upload-sarif: 'false'
          comment: 'false'
          offline: 'true'
      - name: The seeded SQL injection is reported as evidence and nothing blocks
        env:
          FINDINGS: ${{ steps.review.outputs.findings }}
          SARIF: ${{ steps.review.outputs.sarif }}
          BLOCKING: ${{ steps.review.outputs.blocking }}
        run: |
          set -eu
          test "$BLOCKING" = "false"
          jq -e '.findings[] | select(.cwe[0] == "CWE-89" and .location.path == "src/routes/users.js" and .status == "needs-evidence")' "$FINDINGS"
          [[ "$FINDINGS" == "$RUNNER_TEMP"/abliterate.*/findings.json ]]
          jq -e '.runs[0].results | length >= 1' "$SARIF"
          jq -e '.scope.note == "from checkout"' "$GITHUB_WORKSPACE/.abliterate/findings.json"
