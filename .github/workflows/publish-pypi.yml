name: Publish release to PyPI
on: workflow_dispatch
permissions: {}
jobs:
  publish:
    if: github.repository == 'andreaborio/abliterate' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.16'
          enable-cache: false
      - name: Download and verify tagged release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            -p "abliterate-$version-py3-none-any.whl" -p "abliterate-$version.tar.gz" \
            -p "abliterate-$version.tgz" -p SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          uv publish --trusted-publishing always "abliterate-$version-py3-none-any.whl" "abliterate-$version.tar.gz"
